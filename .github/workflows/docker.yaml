name: Publish Docker image

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

jobs:
  push_to_registry:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Build and push Docker image to Docker Hub
    runs-on: docker_image_build_runner
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          # workflow_run always runs in the context of the default branch, so
          # github.ref does NOT point at the release tag that triggered it.
          # Check out the exact commit the Release workflow ran on instead.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Determine release version
        id: release
        run: |
          tag=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: deepdoctection/deepdoctection
          tags: |
            # branch event
            type=ref,event=branch
            # explicit release version, resolved from the checked-out commit
            type=raw,value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.tag != '' }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/gpu/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
